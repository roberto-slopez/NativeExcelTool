[workspace]
members = ["crates/native-excel", "crates/native-excel-node", "crates/native-excel-ffi", "xtask"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
native-excel = { path = "crates/native-excel" }
